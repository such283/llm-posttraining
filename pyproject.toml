[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-posttraining-study"
version = "0.1.0"
requires-python = ">=3.10"
description = "Reproducible LLM post-training and inference optimization experiments"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
